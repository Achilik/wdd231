    <!-- SEO Meta -->

        content="Apply to join the Lagos Chamber of Commerce and access networking, training, advertising, and business growth opportunities."
    >

    <meta name="author" content="Achilike">

    <!-- Open Graph Meta Tags -->
    <meta
        property="og:title"
        content="Join Lagos Chamber of Commerce Membership"
    >

    <meta
        property="og:description"
        content="Apply for chamber membership to connect with businesses, gain exposure, and enjoy exclusive member benefits in Lagos."
    >

    <meta
        property="og:image"
        content="https://achilik.github.io/wdd231/chamber/images/chamber.webp"
    >

    <meta

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Montserrat:wght@600&display=swap"

    <!-- CSS -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

<body>

<header>
    <div class="logo-container">
        <img src="images/logo.jpg" alt="Lagos Chamber Logo" width="80" height="80">

        <div>
            <p class="site-name">Lagos Chamber</p>
            <p class="site-tagline">Commerce </p>
        </div>
    </div>

    <button id="menu" aria-label="Toggle Navigation"></button>

    <nav class="navigation">
        <a href="directory.html" class="active">Directory</a>
        <a href="join.html">Join</a>
        <a href="discover.html">Discover</a>
        <a href="index.html">Home</a>
    </nav>
</header>

<main class="join-page">

    <!-- REQUIRED SINGLE H1 INSIDE MAIN -->
    <h1>Join the Lagos Chamber of Commerce</h1>

    <section class="form-section">

        <h2>Membership Application Form</h2>

        <form method="get" action="thankyou.html">

            <label>
                First Name
                <input
                    type="text"
                    name="first"
                    title="Enter your first name"
                    autocomplete="given-name"
                    required
                >
            </label>

            <label>
                Last Name
                <input
                    type="text"
                    name="last"
                    title="Enter your last name"
                    autocomplete="family-name"
                    required
                >
            </label>

            <label>
                Organizational Title
                <input
                    type="text"
                    name="orgtitle"
                    title="Enter your organizational title"
                    autocomplete="organization-title"
                    pattern="[A-Za-z\\-\\s]{7,}"
                    placeholder="Marketing Manager"
                >
            </label>

            <label>
                Email Address
                <input
                    type="email"
                    name="email"
                    title="Enter your email address"
                    autocomplete="email"
                    placeholder="example@email.com"
                    required
                >
            </label>

            <label>
                Mobile Phone Number
                <input
                    type="tel"
                    name="phone"
                    title="Enter your mobile phone number"
                    autocomplete="tel"
                    required
                >
            </label>

            <label>
                Organization Name
                <input
                    type="text"
                    name="organization"
                    title="Enter your organization name"
                    autocomplete="organization"
                    required
                >
            </label>

            <label>
                Membership Level
                <select
                    name="membership"
                    title="Select a membership level"
                    required
                >
                    <option value="">Select Membership</option>
                    <option value="np">NP Membership</option>
                    <option value="bronze">Bronze Membership</option>
                    <option value="silver">Silver Membership</option>
                    <option value="gold">Gold Membership</option>
                </select>
            </label>

            <label>
                Organization Description
                <textarea
                    name="description"
                    title="Describe your organization"
                ></textarea>
            </label>

            <!-- Hidden Timestamp -->
            <input
                type="hidden"
                id="timestamp"
                name="timestamp"
            >

            <input
                type="submit"
                value="Apply for Membership"
                class="submit-btn"
            >

        </form>

    </section>

</main>

<footer>

    <div class="footer-info">
        <p><strong>Lagos Chamber of Commerce</strong></p>
        <p>10 Marina Road, Lagos, Nigeria</p>
        <p>Email: info@lagoschamber.org</p>
        <p>Phone: +234 800 123 4567</p>
    </div>

    <div class="footer-dev">
        <p>
            &copy; <span id="currentyear"></span>
            Achilike | WDD 231
        </p>

        <p id="lastModified"></p>
    </div>

</footer>

</body>
</html>
